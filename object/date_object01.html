<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>현재 시간</title>
  </head>
  <body>
    <p>
      현재 시각:
      <span class="display">
        <!-- js출력 -->
      </span>
    </p>
    <script>
      // 현재 시간을 나타내는 함수
      function displayNow() {
        let now = new Date();
        const currentTime = now.toLocaleTimeString();
        const display = document.querySelector(".display");
        /* console.log(display); */
        display.innerHTML = `${currentTime}`;
      }
      displayNow(); // 함수 호출
      setInterval(displayNow, 1000);
    </script>
  </body>
</html>
