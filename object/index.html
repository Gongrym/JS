<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>객체</title>
  </head>
  <body>
    <!-- 객체: 여러가지 정보를 하나로 묶어놓은것 -->
    <!-- 내장객체: JS가 미리 만들어놓은 객체 -->
    <!-- ex) Date, Array, String, Math -->
    <script>
      // 1. string
      const str = "Hello world";
      console.log(str);
      console.log(str.length); // 문자의 길이를 알 수 있음
      console.log(str.toUpperCase());
      const sentence = "I like java";
      console.log(sentence.replace("Java", "JavaScript"));
    </script>
  </body>
</html>
