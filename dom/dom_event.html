<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이벤트 실습</title>

    <style>
      li {
        cursor: pointer;
        padding: 5px;
      }

      li:hover {
        color: blue;
        font-weight: bold;
      }

      #result {
        margin-top: 20px;
      }

      #result span {
        color: blue;
        font-weight: bold;
      }

      /* 큰 이미지 */
      #big {
        display: block;
        width: 300px;
        height: 300px;
        object-fit: contain;
        margin-top: 30px;
      }

      /* 작은 이미지 영역 */
      .imgbox {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      .imgbox img {
        width: 100px;
        height: 100px;
        object-fit: contain;
        cursor: pointer;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      .imgbox img:hover {
        border-color: blue;
      }

      /* 삭제 버튼 */
      #todo button {
        margin-left: 15px;
        cursor: pointer;
        padding: 4px 10px;
      }

      #todo button:hover {
        background-color: #ffdddd;
        color: red;
      }
    </style>
  </head>

  <body>
    <!-- 1. 메뉴 클릭 실습 -->
    <ul id="menu">
      <li>회사소개</li>
      <li>제품소개</li>
      <li>고객센터</li>
    </ul>

    <div id="result">
      <!-- 내가 클릭한 글자 JS 출력 -->
    </div>

    <!-- 2. 이미지 변경 실습 -->
    <img src="images/cup-1.png" alt="red cup" id="big" />

    <div class="imgbox">
      <img src="images/cup-1.png" alt="red" />
      <img src="images/cup-2.png" alt="blue" />
    </div>

    <!-- 3. 삭제 버튼 실습 -->
    <h2>오늘 할 일</h2>

    <ul id="todo">
      <li>공부하기 <button>삭제</button></li>
      <li>운동하기 <button>삭제</button></li>
      <li>청소하기 <button>삭제</button></li>
    </ul>

    <script>
      // ==================================
      // 1. 메뉴 클릭 이벤트 (이벤트 위임)
      // ==================================

      const menuE = document.getElementById("menu");
      const result = document.getElementById("result");

      menuE.addEventListener("click", (e) => {
        if (e.target.tagName === "LI") {
          result.innerHTML += `<p>내가 클릭한 메뉴 : <span>${e.target.innerText}</span></p>`;
        }
      });

      // ==================================
      // 2. 작은 이미지 클릭 시 큰 이미지 변경
      // ==================================

      const imgbox = document.querySelector(".imgbox");
      const big = document.querySelector("#big");
      const imgs = document.querySelectorAll(".imgbox img");

      imgs.forEach((img) => {
        console.log(img);

        img.addEventListener("click", () => {
          big.src = img.src;
          big.alt = img.alt;
        });
      });

      // ==================================
      // 3. 삭제 버튼 클릭 시 해당 항목 삭제
      // ==================================

      const todo = document.getElementById("todo");

      todo.addEventListener("click", (e) => {
        // 클릭한 요소가 버튼인지 확인
        if (e.target.tagName === "BUTTON") {
          // 버튼의 부모 요소(li)를 삭제
          e.target.parentElement.remove();
        }
      });
    </script>
  </body>
</html>
