<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이벤트 위임 실습</title>
    <style>
      li {
        cursor: pointer;
        padding: 5px;
      }

      li:hover {
        color: blue;
        font-weight: bold;
      }

      #result {
        margin-top: 20px;
      }

      #result span {
        color: blue;
        font-weight: bold;
      }

      /* 큰 이미지 */
      #big {
        display: block;
        width: 300px;
        height: 300px;
        object-fit: contain;
        margin-top: 30px;
      }

      /* 작은 이미지 영역 */
      .imgbox {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      .imgbox img {
        width: 100px;
        height: 100px;
        object-fit: contain;
        cursor: pointer;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      .imgbox img:hover {
        border-color: blue;
      }
    </style>
  </head>

  <body>
    <ul id="menu">
      <li>회사소개</li>
      <li>제품소개</li>
      <li>고객센터</li>
    </ul>

    <div id="result">
      <!-- 내가 클릭한 글자 JS 출력 -->
    </div>

    <!-- 큰 이미지 -->
    <img src="images/cup-1.png" alt="red cup" id="big" />

    <!-- 작은 이미지 -->
    <div class="imgbox">
      <img src="images/cup-1.png" alt="red" />
      <img src="images/cup-2.png" alt="blue" />
    </div>

    <script>
      // 메뉴 클릭 이벤트
      const menuE = document.getElementById("menu");
      const result = document.getElementById("result");

      menuE.addEventListener("click", (e) => {
        if (e.target.tagName === "LI") {
          result.innerHTML += `<p>내가 클릭한 메뉴 : <span>${e.target.innerText}</span></p>`;
        }
      });

      // 작은 이미지 클릭 시 큰 이미지로 변경
      const imgbox = document.querySelector(".imgbox");
      const big = document.querySelector("#big");

      imgbox.addEventListener("click", (e) => {
        // 클릭한 요소가 이미지인지 확인
        if (e.target.tagName === "IMG") {
          // 큰 이미지 변경
          big.src = e.target.src;
          big.alt = e.target.alt;
        }
      });
    </script>
  </body>
</html>
