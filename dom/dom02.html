<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 웹 요소의 내용 수정 -->
    <button onclick="innerTxt()">innerText로 표시하기</button>
    <button onclick="innerHm()">innerHTML로 표시하기</button>
    <h1>현재 시각 :</h1>
    <div id="current">
      <!-- JS출력 -->
    </div>
    <script>
      const current = document.querySelector("#current");
      // 요소명.innerText = 내용
      // 요소명.innerHTML = 내용
      const now = new Date();
      console.log(now);
      // innerTxt() 함수 정의
      function innerTxt() {
        // 실행코드
        /* console.log("확인"); */
        // current.innerText = now;
        current.innerText = `<strong>${now}</strong>`;
      }
      function innerHm() {
        current.innnerHTML = `<strong>${now}</strong>`;
      }
    </script>
  </body>
</html>
