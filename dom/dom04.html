<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #cover2 {
        width: 100px;
        border-radius: 50%;
        background-color: red;
        border: 3px solid red;
      }
    </style>
  </head>
  <body>
    <img src="images/easys-1.jpg" alt="이미지" id="cover" />
    <script>
      const cover = document.getElementById("cover");
      cover.addEventListener("mouseover", (event) => {
        cover.src = "images/easys-2.jpg";
        cover.id = "cover2";
      });
      cover.addEventListener("mouseout", () => {
        cover.src = "images/easys-1.jpg";
        cover.id = "cover1";
      });
    </script>
  </body>
</html>
