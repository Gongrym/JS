<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dom요소 생성</title>
  </head>
  <body>
    <div id="container">
      <h1>웹 프로그래밍</h1>
      <!-- p태그 생성 -->
      <!-- js생성 -->
    </div>
    <script>
      // p태그 생성
      const newP = document.createElement("p");
      console.log(newP);
      const txtNode = document.createTextNode(
        "DOM은 document object model의 준말이다.",
      );
      console.log(txtNode);
      // p태그에 글자를 넣는다
      newP.appendChild(txtNode);
      console.log(newP);
      // container 영역안에 p태그 연결
      document.querySelector("#contatiner").appendChild(newP);
    </script>
  </body>
</html>
