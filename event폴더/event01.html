<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이벤트 실습</title>
    <style>
      .box {
        width: 200px;
        height: 100px;
        background-color: aquamarine;
        margin: 20px 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <!-- 클릭 이벤트 -->
    <button id="btn">눌러보세요</button>

    <!-- 입력 이벤트 -->
    <input type="text" id="inputName" placeholder="이름을 입력하세요" />

    <!-- 폼 이벤트 -->
    <form id="myForm">
      <input type="text" id="inputEmail" placeholder="이메일을 입력하세요" />
      <button type="submit">제출</button>
    </form>

    <p id="result"></p>

    <!-- 마우스 이벤트 -->
    <div class="box">마우스를 올려보세요!</div>

    <!-- 키보드 이벤트 -->
    <input type="text" id="keyInput" placeholder="키보드를 눌러보세요" />

    <script>
      // 클릭 이벤트
      const btn = document.querySelector("#btn");

      btn.addEventListener("click", () => {
        console.log("click");
        btn.style.color = "red";
      });

      // 입력 이벤트
      const userName = document.querySelector("#inputName");

      userName.addEventListener("input", () => {
        console.log(userName.value);
      });

      // 폼 이벤트
      const form = document.querySelector("#myForm");
      const userEmail = document.querySelector("#inputEmail");
      const result = document.querySelector("#result");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        console.log("폼이 제출되었습니다.");
        console.log(userEmail.value);

        result.textContent = userEmail.value;
      });

      // 마우스 이벤트
      const box = document.querySelector(".box");

      box.addEventListener("mouseover", () => {
        box.style.backgroundColor = "orange";
      });

      box.addEventListener("mouseout", () => {
        box.style.backgroundColor = "aquamarine";
      });

      // 키보드 이벤트
      const keyInput = document.querySelector("#keyInput");

      keyInput.addEventListener("keydown", (event) => {
        console.log(event.key);
      });

      // 브라우저 크기 변경 이벤트
      window.addEventListener("resize", () => {
        if (window.innerWidth < 768) {
          console.log("화면이 작아졌습니다.");
        }
      });
    </script>
  </body>
</html>
