<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript 함수 테스트</title>
  </head>

  <body>
    <h1>JavaScript 함수 테스트</h1>
    <div id="result"></div>

    <script>
      const result = document.querySelector("#result");

      // 1. 두 숫자를 더하는 함수
      function add(a, b) {
        return a + b;
      }

      // 2. 숫자가 짝수인지 확인하는 함수
      function isEven(num) {
        return num % 2 === 0;
      }

      // 3. 이름을 받아 인사하는 함수
      function greet(name) {
        return `안녕하세요, ${name}님!`;
      }

      // 4. 배열의 모든 숫자를 더하는 함수
      function sumArray(arr) {
        return arr.reduce((sum, num) => sum + num, 0);
      }

      // 5. 배열에서 가장 큰 숫자를 찾는 함수
      function findMax(arr) {
        return Math.max(...arr);
      }

      // 6. 화살표 함수
      const multiply = (a, b) => a * b;

      // 함수 실행 테스트
      result.innerHTML = `
        <h2>1. add(10, 20)</h2>
        <p>${add(10, 20)}</p>

        <h2>2. isEven(7)</h2>
        <p>${isEven(7)}</p>

        <h2>3. greet("누루미")</h2>
        <p>${greet("누루미")}</p>

        <h2>4. sumArray([10, 20, 30])</h2>
        <p>${sumArray([10, 20, 30])}</p>

        <h2>5. findMax([5, 12, 3, 27, 8])</h2>
        <p>${findMax([5, 12, 3, 27, 8])}</p>

        <h2>6. multiply(4, 5)</h2>
        <p>${multiply(4, 5)}</p>
      `;
    </script>
  </body>
</html>
